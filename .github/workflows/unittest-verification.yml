name: UnitTest-Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore ./WebExpress.WebCore.sln

      - name: Build project
        run: dotnet build ./WebExpress.WebCore.sln --no-restore --configuration Release

      - name: Run xUnit tests
        id: tests
        continue-on-error: true
        run: dotnet test ./WebExpress.WebCore.Test/WebExpress.WebCore.Test.csproj --no-build --configuration Release

      - name: Print test logs on failure
        if: steps.tests.outcome == 'failure'
        run: |
          find ./WebExpress.WebCore.Test/bin/Release -type f -path "*/TestResults/*.log" -print -exec tail -n 200 {} \;

      - name: Fail workflow when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
