name: Generate Documentation

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup .NET SDK 
      uses: actions/setup-dotnet@v3 
      with: 
        dotnet-version: '9.0.x'

    - name: Install DocFX 
      run: dotnet tool install -g docfx 
      
    - name: Add DocFX to PATH 
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Navigate to project directory
      working-directory: src/WebExpress.WebCore
      run: dotnet restore

    - name: Configure Git 
      run: | 
        git config --global user.email "rene_schwarzer@hotmail.de" 
        git config --global user.name "ReneSchwarzer"

    - name: Generate documentation
      working-directory: src/WebExpress.WebCore
      run: docfx build -o ../../docs

    - name: Commit and push documentation
      run: |
        git add -f docs
        git commit -m "Update documentation"
        git push
